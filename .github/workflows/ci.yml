name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python Syntax
      run: |
        # Compile all Python scripts to check for syntax errors
        python -m py_compile main.py app.py fetch_soil.py
        python -m py_compile db/seed.py
        python -m py_compile rag/ingest.py rag/retriever.py
        python -m py_compile reasoning/conversation.py reasoning/recommender.py
        echo "✅ All Python files compiled successfully."